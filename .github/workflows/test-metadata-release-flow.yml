name: Test metadata release flow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing MCR release version to validate
        required: true
        type: string
        default: "11.0.0"

jobs:
  publish-release-metadata:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Create GitHub release
        shell: bash
        run: |
          if ! gh release view ${{ inputs.tag }} >/dev/null 2>&1; then
            gh release create ${{ inputs.tag }} \
              --target ${{ github.sha }} \
              --title "${{ inputs.tag }} metadata release-flow test" \
              --notes "Metadata-only release-flow validation in the personal fork."
          fi

      # This is the same metadata action used by create-github-release upstream.
      - name: Release metadata chart
        uses: ./.github/actions/release-metadata
        with:
          tag: ${{ inputs.tag }}
          environment: unlisted
          registry-name: ${{ secrets.RELEASE_ACR_NAME }}
          pages-branch: main
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          tenant-id: ${{ secrets.RELEASE_TENANT_ID }}
          subscription-id: ${{ secrets.RELEASE_SUBSCRIPTION_ID }}
