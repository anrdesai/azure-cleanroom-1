name: Test metadata release flow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing MCR release version to validate
        required: true
        type: string
        default: "11.0.0"

jobs:
  stage-release-metadata:
    runs-on: [self-hosted]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          tenant-id: ${{ secrets.RELEASE_TENANT_ID }}
          subscription-id: ${{ secrets.RELEASE_SUBSCRIPTION_ID }}

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Build and push release-metadata catalog
        shell: pwsh
        run: |
          az acr login --name ${{ secrets.RELEASE_ACR_NAME }}
          Install-Module -Name powershell-yaml -Force
          $outDir = "${{ runner.temp }}/release-metadata"
          $acrRepo = "${{ secrets.RELEASE_ACR_NAME }}.azurecr.io/unlisted/azurecleanroom"
          ./build/build-release-metadata-chart.ps1 `
            -repo mcr.microsoft.com/azurecleanroom `
            -publishRepo mcr.microsoft.com/azurecleanroom `
            -tag ${{ inputs.tag }} `
            -outDir $outDir
          helm push "$outDir/release-metadata-${{ inputs.tag }}.tgz" "oci://$acrRepo"
          helm show values "oci://$acrRepo/release-metadata" `
            --version ${{ inputs.tag }} | Out-Null

  post-release-validation:
    needs: stage-release-metadata
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    uses: ./.github/workflows/release_verification_nightly.yml
    with:
      release-metadata-version: ${{ inputs.tag }}
    secrets:
      release-metadata-chart-url: >-
        oci://${{ secrets.RELEASE_ACR_NAME }}.azurecr.io/unlisted/azurecleanroom/release-metadata

  publish-release-metadata:
    needs: [stage-release-metadata, post-release-validation]
    runs-on: [self-hosted]
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.RELEASE_CLIENT_ID }}
          tenant-id: ${{ secrets.RELEASE_TENANT_ID }}
          subscription-id: ${{ secrets.RELEASE_SUBSCRIPTION_ID }}

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Create GitHub release
        shell: bash
        run: |
          if ! gh release view ${{ inputs.tag }} >/dev/null 2>&1; then
            gh release create ${{ inputs.tag }} \
              --target ${{ github.sha }} \
              --title "${{ inputs.tag }} metadata release-flow test" \
              --notes "Metadata-only release-flow validation in the personal fork."
          fi

      - name: Publish validated release-metadata chart
        id: publish
        shell: pwsh
        run: |
          az acr login --name ${{ secrets.RELEASE_ACR_NAME }}
          $packagePath = "${{ runner.temp }}/release-metadata"
          New-Item -ItemType Directory -Force $packagePath | Out-Null
          $acrRepo = "${{ secrets.RELEASE_ACR_NAME }}.azurecr.io/unlisted/azurecleanroom"
          helm pull "oci://$acrRepo/release-metadata" `
            --version ${{ inputs.tag }} `
            --destination $packagePath
          $asset = "$packagePath/release-metadata-${{ inputs.tag }}.tgz"
          gh release upload ${{ inputs.tag }} $asset --clobber

          $crVersion = "1.8.1"
          $crDir = "${{ runner.temp }}/crbin"
          New-Item -ItemType Directory -Force $crDir | Out-Null
          $crUrl = "https://github.com/helm/chart-releaser/releases/download/" +
            "v$crVersion/chart-releaser_${crVersion}_linux_amd64.tar.gz"
          Invoke-WebRequest -Uri $crUrl -OutFile "$crDir/cr.tgz"
          tar -xz -C $crDir -f "$crDir/cr.tgz" cr

          git fetch origin "main:refs/remotes/origin/main"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          & "$crDir/cr" index `
            --owner $env:GITHUB_REPOSITORY_OWNER `
            --git-repo ($env:GITHUB_REPOSITORY -split '/')[1] `
            --token $env:GH_TOKEN `
            --package-path $packagePath `
            --release-name-template "{{ .Version }}" `
            --pages-branch main `
            --pages-index-path index.yaml `
            --index-path "${{ runner.temp }}/index.yaml" `
            --pr
          "asset=$asset" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Attest release-metadata chart
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.publish.outputs.asset }}
